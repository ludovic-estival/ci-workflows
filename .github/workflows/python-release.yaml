name: Python Linux Release

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Project directory (pyproject.toml and uv.lock)"
        type: string
        default: "."
      name:
        description: "Executable name"
        type: string
        required: true
      entrypoint:
        description: "Python entry point"
        type: string
        required: true
      paths:
        description: "Option --paths for PyInstaller"
        type: string
        default: "src"
      icon:
        description: "Icon path (empty = no icons)"
        type: string
        default: ""
      runner:
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        working-directory: .
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Build executable
        env:
          APP_NAME: ${{ inputs.name }}
          ENTRYPOINT: ${{ inputs.entrypoint }}
          PY_PATHS: ${{ inputs.paths }}
          ICON: ${{ inputs.icon }}
        run: |
          ARGS=(--onefile --name "$APP_NAME" --paths "$PY_PATHS")
          if [ -n "$ICON" ]; then ARGS+=(--icon "$ICON"); fi
          uv run pyinstaller "${ARGS[@]}" "$ENTRYPOINT"

      - name: Rename artefact
        env:
          APP_NAME: ${{ inputs.name }}
        run: mv "dist/$APP_NAME" "dist/$APP_NAME-linux-x86_64"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ inputs.name }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/$APP_NAME-linux-x86_64" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes